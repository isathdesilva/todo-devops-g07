global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node          # server CPU, RAM, disk I/O, network
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: todo-app      # HTTP request latency from the app's /metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["todo-app:3000"]
