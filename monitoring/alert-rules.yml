groups:
  - name: production-alerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "CPU usage above 80% on the Production server"

      - alert: AppDown
        expr: up{job="todo-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "To-Do app is not responding on the Production server"
