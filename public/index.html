<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; }
    main { max-width: 560px; margin: 48px auto; background: #fff; padding: 28px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    h1 { margin-top: 0; color: #d42e12; }
    form { display: flex; gap: 8px; margin-bottom: 20px; }
    input { flex: 1; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 16px; font-size: 16px; background: #1e1e1e; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { padding: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
    li.done { text-decoration: line-through; color: #999; }
    #error { color: #d42e12; min-height: 1em; }
    footer { font-size: 12px; color: #888; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Group 7 To-Do List v3</h1>
    <form id="add-form">
      <input id="task-input" placeholder="What do you need to do?" autocomplete="off">
      <button type="submit" id="add-btn">Add</button>
    </form>
    <p id="error"></p>
    <ul id="task-list"></ul>
    <footer>Click a task to mark it complete. <span id="version"></span></footer>
  </main>
  <script>
    const list = document.getElementById('task-list');
    const errorBox = document.getElementById('error');

    async function load() {
      const res = await fetch('/api/tasks');
      const tasks = await res.json();
      list.innerHTML = '';
      tasks.forEach((t) => {
        const li = document.createElement('li');
        li.textContent = t.title;
        li.dataset.id = t.id;
        if (t.completed) li.classList.add('done');
        li.addEventListener('click', async () => {
          if (t.completed) return;
          await fetch(`/api/tasks/${t.id}/complete`, { method: 'PATCH' });
          load();
        });
        list.appendChild(li);
      });
    }

    document.getElementById('add-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value }),
      });
      if (!res.ok) {
        errorBox.textContent = (await res.json()).error;
        return;
      }
      errorBox.textContent = '';
      input.value = '';
      load();
    });

    fetch('/health').then((r) => r.json()).then((h) => {
      document.getElementById('version').textContent = `Env: ${h.env} | Version: ${h.version}`;
    }).catch(() => {});

    load();
  </script>
</body>
</html>
